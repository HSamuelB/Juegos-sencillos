<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="juego">
        <h3>Piedra, papel o tijera</h3>
        <p>Elige una opción para jugar contra la computadora.</p>
        <div class="opciones">
            <button class="btnOpcion" data-opcion="piedra">
            <img src="/PiedraPapelTijera/img/Piedra.png" width="28px" height="28px">
            Piedra
            </button>
            <button class="btnOpcion" data-opcion="papel">
            <img src="/PiedraPapelTijera/img/Papel.png" width="28px" height="28px">
            Papel
            </button>
            <button class="btnOpcion" data-opcion="tijera"> 
            <img src="/PiedraPapelTijera/img/Tijera.png" width="28px" height="28px">
            Tijera
            </button>
        </div>
        <p id="resultadoJuego2"></p>
        <p id="marcadorJuego2">Ganadas: 0 | Perdidas: 0 | Empates: 0</p>
        <button id="btnReiniciarJuego2">Reiniciar marcador</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
